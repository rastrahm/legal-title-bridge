[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc = "0.8.37"
evm_version = "cancun"
optimizer = true
optimizer_runs = 10_000
via_ir = true
fs_permissions = [
    { access = "read", path = "./src" },
    { access = "read-write", path = "./test" },
    { access = "read", path = "./script" },
]

[profile.default.fuzz]
runs = 1000

# Invariantes: secuencias largas a propósito (puente Eth↔Sol + estados raros).
# depth 50 = default diario; profile `heavy` = depth 100 para exprimir el i9.
[profile.default.invariant]
runs = 256
depth = 50

# Heavy profile: forge test --profile heavy
[profile.heavy]
src = "src"
out = "out"
libs = ["lib"]
solc = "0.8.37"
evm_version = "cancun"
optimizer = true
optimizer_runs = 10_000
via_ir = true

[profile.heavy.fuzz]
runs = 2000

[profile.heavy.invariant]
runs = 512
depth = 100

[rpc_endpoints]
sepolia = "${SEPOLIA_RPC_URL}"
mainnet = "${MAINNET_RPC_URL}"

[fmt]
line_length = 120
tab_width = 4
bracket_spacing = false
int_types = "long"
multiline_func_header = "attributes_first"
quote_style = "double"
number_underscore = "preserve"
single_line_statement_blocks = "multi"

[lint]
# asm-keccak256: prefer readable keccak256 in codec; gas path optimizes later.
# unsafe-cheatcode: tests/scripts intentionally use vm.readFile / writeFile for C5 vectors.
exclude_lints = ["asm-keccak256", "unsafe-cheatcode"]
